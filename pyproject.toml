[project]
name = "riskcube-mcp"
version = "0.1.0"
description = "Explainable RiskCube pricing MCP server for structured equity-linked products"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "autograd>=1.7,<2",
    "mcp>=1.6,<2",
    "numpy>=2.0,<3",
    "pydantic>=2.8,<3",
    "quantlib>=1.35,<2",
    "quantlib-risks>=1.33,<2",
    "xad>=1.5,<2",
]

[project.scripts]
riskcube-mcp = "riskcube_mcp:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1,<3",
    "mypy>=1.11,<2",
    "pytest>=8.0,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
]

[tool.vercel]
entrypoint = "api.index:app"
